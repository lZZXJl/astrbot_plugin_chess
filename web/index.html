<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>棋盘</title>
<style>
  :root{
    --bg:#0d1520;
    --panel:#131e2b;
    --line:#22344a;
    --light:#e8e2d4;
    --dark:#7d94ab;
    --accent:#5fb3d4;
    --text:#cfe0ee;
    --dim:#6b8098;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  #rotate{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);z-index:50;font-size:15px;color:var(--dim);letter-spacing:.08em;
  }
  #app{display:none;flex:1;min-height:0}

  /* 横屏：左棋盘右面板 */
  @media (orientation:landscape) and (min-width:640px){
    body.fine #rotate{display:none}
    body.fine #app{display:flex}
  }
  /* 竖屏也允许用，只是提示 */
  body.forced #rotate{display:none}
  body.forced #app{display:flex;flex-direction:column}

  #boardWrap{
    flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
    padding:8px;position:relative;
  }
  #board{
    display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
    width:min(100%,calc(100vh - 24px));aspect-ratio:1/1;max-height:100%;
    border-radius:6px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  .sq{position:relative;display:flex;align-items:center;justify-content:center;
      font-size:min(7vh,4.2vw);line-height:1;user-select:none;transition:background .12s}
  .sq.l{background:var(--light)}
  .sq.d{background:var(--dark)}
  .sq.sel{box-shadow:inset 0 0 0 3px var(--accent)}
  .sq.last::after{content:"";position:absolute;inset:0;background:rgba(95,179,212,.22)}
  .sq .dot{position:absolute;width:18%;height:18%;border-radius:50%;background:rgba(30,60,80,.45)}
  .sq .ring{position:absolute;inset:6%;border:3px solid rgba(30,60,80,.45);border-radius:50%}
  .w{color:#fbfaf6;text-shadow:0 1px 2px rgba(0,0,0,.55)}
  .b{color:#131c26;text-shadow:0 1px 1px rgba(255,255,255,.25)}
  .coord{position:absolute;font-size:9px;opacity:.5}

  #side{
    width:clamp(240px,32vw,380px);display:flex;flex-direction:column;
    background:var(--panel);border-left:1px solid var(--line);min-height:0;
  }
  body.forced #side{width:auto;flex:1;border-left:none;border-top:1px solid var(--line)}
  #status{
    padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;
    display:flex;justify-content:space-between;align-items:center;color:var(--dim);
  }
  #status b{color:var(--accent);font-weight:600}
  #log{
    flex:1;overflow-y:auto;padding:10px 14px;font-size:13px;line-height:1.7;min-height:0;
  }
  #log .m{margin-bottom:6px;word-break:break-word}
  #log .m.user{color:#9fd8ef}
  #log .m.bot{color:#e6eef6}
  #log .m.sys{color:var(--dim);font-size:12px}
  #log .m .who{font-size:11px;opacity:.55;margin-right:6px}

  #bar{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
  #bar input{
    flex:1;background:#0b1420;border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:9px 11px;font-size:14px;outline:none;min-width:0;
  }
  #bar input:focus{border-color:var(--accent)}
  #bar button{
    background:#1b2d3f;border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:0 13px;font-size:13px;cursor:pointer;
  }
  #bar button:active{background:#24405a}
  #tools{display:flex;gap:6px;padding:0 12px 8px}
  #tools button{
    flex:1;background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:7px;padding:7px 0;font-size:12px;cursor:pointer;
  }
  #tools button:active{color:var(--text);border-color:var(--accent)}
</style>
</head>
<body>
<div id="rotate">横过来用<span style="opacity:.4">（点一下强制竖屏也行）</span></div>
<div id="app">
  <div id="boardWrap"><div id="board"></div></div>
  <div id="side">
    <div id="status"><span id="turnText">连接中…</span><span id="sideText"></span></div>
    <div id="log"></div>
    <div id="tools">
      <button id="btnNew">重开</button>
      <button id="btnUndo">悔棋</button>
      <button id="btnFlip">翻面</button>
      <button id="btnResign">认输</button>
    </div>
    <div id="bar">
      <input id="input" placeholder="说点什么…" autocomplete="off">
      <button id="send">发</button>
    </div>
  </div>
</div>
<script>
const GLYPH={p:"♟",n:"♞",b:"♝",r:"♜",q:"♛",k:"♚"};
const FILES="abcdefgh";
let state=null, sel=null, flipped=false, seq=0, lastRenderedFen="";

const boardEl=document.getElementById("board");
const logEl=document.getElementById("log");
const turnText=document.getElementById("turnText");
const sideText=document.getElementById("sideText");

document.getElementById("rotate").onclick=()=>document.body.classList.add("forced");
if(window.innerWidth>window.innerHeight) document.body.classList.add("fine");

function sqName(r,c){ // r,c 为屏幕行列
  const rank = flipped ? r : 7-r;
  const file = flipped ? 7-c : c;
  return FILES[file]+(rank+1);
}

function render(){
  if(!state) return;
  const cells=[];
  const last=state.last_move||[];
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const rank = flipped ? r : 7-r;
      const file = flipped ? 7-c : c;
      const piece=state.board[7-rank][file];
      const name=FILES[file]+(rank+1);
      const cls=["sq", (rank+file)%2===0?"d":"l"];
      if(sel===name) cls.push("sel");
      if(last.includes(name)) cls.push("last");
      let inner="";
      if(piece){
        const isW=piece===piece.toUpperCase();
        inner=`<span class="${isW?'w':'b'}">${GLYPH[piece.toLowerCase()]}</span>`;
      }else if(sel && state.legal[sel] && state.legal[sel].includes(name)){
        inner=`<span class="dot"></span>`;
      }else if(sel && name===sel){
        inner="";
      }
      if(sel && sel!==name && state.legal[sel] && state.legal[sel].includes(name) && piece){
        inner+=`<span class="ring"></span>`;
      }
      cells.push(`<div class="${cls.join(' ')}" data-sq="${name}">${inner}</div>`);
    }
  }
  boardEl.innerHTML=cells.join("");

  const whose = state.turn==="white"?"白方":"黑方";
  const mine = state.player_side===state.turn;
  if(state.result){ turnText.innerHTML=`<b>${state.result}</b>`; }
  else if(mine){ turnText.innerHTML=`轮到<b>你</b>（${whose}）`; }
  else { turnText.innerHTML=`等<b>鲸</b>走（${whose}）`; }
  sideText.textContent=`你执${state.player_side==='white'?'白':'黑'}`;
  lastRenderedFen=state.fen;
}

async function refresh(){
  try{
    const r=await fetch("/api/state");
    state=await r.json();
    render();
  }catch(e){ turnText.textContent="连不上"; }
}

boardEl.onclick=(ev)=>{
  const el=ev.target.closest(".sq");
  if(!el||!state) return;
  const name=el.dataset.sq;
  if(sel && state.legal[sel] && state.legal[sel].includes(name)){
    sendMove(sel+name);
    sel=null;
    return;
  }
  const piece=state.board[7-(+name[1]-1)][FILES.indexOf(name[0])];
  if(piece && name===sel){ sel=null; render(); return; }
  if(state.legal[name]){ sel=name; }
  else { sel=null; }
  render();
};

async function sendMove(move){
  try{
    const r=await fetch("/api/move",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({move})});
    const d=await r.json();
    state=d.state; sel=null; render();
    if(!d.ok) flash(d.msg);
  }catch(e){ flash("没送出去"); }
}

function flash(text){
  const d=document.createElement("div");
  d.className="m sys"; d.textContent=text; logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
}

function addMsg(m){
  const d=document.createElement("div");
  d.className="m "+(m.role==="user"?"user":m.role==="bot"?"bot":"sys");
  if(m.role==="bot"||m.role==="user"){
    const w=document.createElement("span");
    w.className="who"; w.textContent=m.role==="bot"?"鲸":"你";
    d.appendChild(w);
  }
  d.appendChild(document.createTextNode(m.text));
  logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
}

async function pollEvents(){
  try{
    const r=await fetch(`/api/events?since=${seq}`);
    const d=await r.json();
    // 服务端重启后序号会从头来，本地 seq 偏大就会一直拉到空
    if(typeof d.seq==="number" && d.seq<seq){
      seq=0;
      const r2=await fetch("/api/events?since=0");
      const d2=await r2.json();
      (d2.messages||[]).forEach(m=>{ addMsg(m); seq=Math.max(seq,m.id); });
      return;
    }
    (d.messages||[]).forEach(m=>{ addMsg(m); seq=Math.max(seq,m.id); });
  }catch(e){}
}

const input=document.getElementById("input");
async function sendChat(){
  const text=input.value.trim();
  if(!text) return;
  input.value="";
  try{
    await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
  }catch(e){ flash("这句没发出去"); }
}
document.getElementById("send").onclick=sendChat;
input.addEventListener("keydown",e=>{ if(e.key==="Enter") sendChat(); });

document.getElementById("btnNew").onclick=async()=>{
  await fetch("/api/new",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({side:"white"})});
  sel=null; await refresh();
};
document.getElementById("btnUndo").onclick=async()=>{
  await fetch("/api/undo",{method:"POST"}); sel=null; await refresh();
};
document.getElementById("btnFlip").onclick=()=>{ flipped=!flipped; render(); };
document.getElementById("btnResign").onclick=async()=>{
  if(!confirm("真认输？")) return;
  await fetch("/api/resign",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({})});
  await refresh();
};

refresh();
setInterval(refresh,1500);
setInterval(pollEvents,1500);
</script>
</body>
</html>
