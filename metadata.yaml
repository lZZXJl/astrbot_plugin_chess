name: astrbot_plugin_chess
display_name: 网页棋盘(国际象棋)
short_desc: 在本地网页上下国际象棋，棋盘旁边还能和 AI 聊天
desc: |
  在你自己的设备上开一个轻量网页，用图形棋盘和 AI 对弈；每一步都回流到
  AstrBot 的会话里，由大模型接管对话与应手。

  特点：
  - 棋盘规则由 python-chess 维护，插件本身不实现任何棋规
  - 六套棋盘配色、三种棋子样式，随手切换，选择记在浏览器里
  - 网页适配手机横屏，可当输入法用
  - 网页聊天区与 QQ 侧共用同一局棋和同一段对话
  - 选执黑开局时 AI 自动先走第一步，不用再催
  - 附带 chess_state / chess_move / chess_new / chess_undo 四个 LLM 工具
version: 0.2.2
author: lZZXJl
repo: "https://github.com/lZZXJl/astrbot_plugin_chess"
support_platforms:
  - aiocqhttp
tags:
  - 游戏
  - 国际象棋
  - 网页
